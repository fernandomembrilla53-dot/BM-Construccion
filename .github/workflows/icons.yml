name: Iconos BM Construcción
on:
  push:
    branches: [renovacion-premium-2026]
    paths: ['icon.svg', '.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iconos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renderizar iconos desde SVG
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          for n in (192,512):
              cairosvg.svg2png(url="icon.svg",write_to=f"icon-{n}.png",output_width=n,output_height=n)
          PY
      - name: Actualizar iconos del repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: sincronizar iconos PNG desde logo SVG"
            git push
          fi
