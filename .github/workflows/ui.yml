name: UI y capturas para Play
on:
  push:
    branches: [main, renovacion-premium-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Probar app y generar capturas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bm-web.log 2>&1 &
          node tests/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BM-Construccion-Capturas
          path: store-assets/screenshots/*.png
          retention-days: 14
