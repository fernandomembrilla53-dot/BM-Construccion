name: Android · Build de prueba
on:
  push:
    branches: [main, renovacion-premium-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK 36
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compilar APK de depuración y bundle sin firmar
        run: gradle -p android :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BM-Construccion-Android-Sin-Firmar
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
